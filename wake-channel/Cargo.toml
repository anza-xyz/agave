[package]
name = "agave-wake-channel"
description = "Futex-based wakeups for crossbeam channels feeding a pool of consumer threads"
documentation = "https://docs.rs/agave-wake-channel"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
agave-unstable-api = []
shuttle-test = ["dep:shuttle"]

[dependencies]
atomic-wait = { workspace = true }
crossbeam-channel = { workspace = true }
crossbeam-utils = { workspace = true }
shuttle = { workspace = true, optional = true }

[lints]
workspace = true
