too-many-arguments-threshold = 9

# Disallow specific methods from being used
disallowed-methods = [
    { path = "std::net::UdpSocket::bind", reason = "Use solana_net_utils::bind_with_config, bind_to, etc instead for proper socket configuration." },
    { path = "tokio::net::UdpSocket::bind", reason = "Use solana_net_utils::bind_to_async or bind_to_with_config_non_blocking instead for proper socket configuration." },
    { path = "lazy_static::initialize", reason = "Deprecated. Use std::{cell::{LazyCell, OnceCell}, sync::{LazyLock, OnceLock}} as appropriate." },
    { path = "imbl_sized_chunks::sized_chunk::Chunk::clear", reason = "Double free / use-after-free when an element's Drop panics (RUSTSEC-2026-0292)." },
    { path = "imbl_sized_chunks::sized_chunk::Chunk::drop_left", reason = "Double free / use-after-free when an element's Drop panics (RUSTSEC-2026-0292)." },
    { path = "imbl_sized_chunks::sized_chunk::Chunk::drop_right", reason = "Double free / use-after-free when an element's Drop panics (RUSTSEC-2026-0292)." },
    { path = "imbl_sized_chunks::inline_array::InlineArray::clear", reason = "Double free / use-after-free when an element's Drop panics (RUSTSEC-2026-0292)." },
    { path = "imbl_sized_chunks::inline_array::InlineArray::truncate", reason = "Double free / use-after-free when an element's Drop panics (RUSTSEC-2026-0292)." },
]

disallowed-macros = [
    { path = "solana_sdk::saturating_add_assign", reason = "Deprecated. Use std::num::Saturating<T> instead." },
    { path = "lazy_static::lazy_static", reason = "Deprecated. Use std::{cell::{LazyCell, OnceCell}, sync::{LazyLock, OnceLock}} as appropriate." },
]

disallowed-types = [
    { path = "imbl::Vector", reason = "Internally calls imbl-sized-chunks Chunk::drop_left/drop_right, which are affected by RUSTSEC-2026-0292." },
]
