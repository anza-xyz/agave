# Built-in host-independent validator policy, and the reference for the file
# format. Print it with `agave-validator --print-default-config`.
#
# XDP transmit exists only on Linux. Other platforms still parse and validate this
# policy, so a file means the same thing everywhere, but report it as inactive.
#
# Three layers form the effective configuration, each overriding the previous:
# this built-in policy, then a file passed with `--config-file`, then matching
# CLI flags. A user file patches matching interface labels and all other fields,
# and unknown fields are rejected rather than ignored. If a user file contains
# `interfaces`, its labels replace the built-in label set: omitted labels are
# removed, matching labels inherit unspecified fields, and new labels must
# specify `device`, `xdp.zero_copy`, and `xdp.workers`. `device` and `workers`
# are single choices, so naming either one replaces that whole choice rather
# than merging into it.
#
# schema_version must be 1. Omitting it means 1.
#
# [xdp]
#   enabled     Global gate. When false every module uses OS sockets whatever
#               its own `enabled` says. `--no-xdp` forces this false, and
#               nothing turns it back on.
#
# [interfaces.<label>]
#               <label> is a logical name, not a device name. Version 1
#               supports exactly one effective interface. To rename `primary`,
#               provide one complete interface under the new label. Specifying
#               multiple labels is rejected. Specify exactly one selector:
#   device.route = "default"    Bind the NIC carrying the default route.
#   device.name  = "ens1f0"     Bind this device by name.
#
# [interfaces.<label>.xdp]
#   zero_copy   Strictly request AF_XDP zero-copy mode. Startup fails rather
#               than falling back automatically when it is unsupported.
#               `--xdp-zero-copy` / `--no-xdp-zero-copy` override it.
#               Specify exactly one worker mode, holding 1 to 4096 workers.
#               Every worker CPU must be in the process CPU-affinity set and
#               must not be the PoH core:
#   workers.auto.count = 1      Take the N highest eligible CPUs, excluding the
#                               PoH core, and assign hardware queues 0..N-1 in
#                               that order. At least one CPU must stay
#                               unreserved, so this cannot claim every CPU.
#   workers.cpus = [8, 9]       Name the CPUs. Hardware queues 0..n-1 map to
#                               the list in order.
#   workers.bindings = [        Name hardware queue ids explicitly, for a NIC
#     { queue = 0, cpu = 8 },   whose queues are not 0..n-1. List order is
#     { queue = 3, cpu = 9 },   sender order. Requires device.name, since queue
#   ]                           ids are specific to one device.
#               `--xdp-cpu-cores` replaces the whole worker choice with the
#               equivalent of workers.cpus.
#               The workers selected by enabled modules must leave at least
#               one process CPU unreserved for the main thread.
#
# [<module>.xdp] for tpu, turbine, repair and gossip
#   enabled     False leaves that module on OS sockets.
#   tx.queues   Which of the interface's workers this module transmits over:
#               "all", or hardware queue ids in sender order, e.g. [0, 3].
#               Ids must exist in the worker pool above. Two modules may name
#               the same queue; they then share its sender.

schema_version = 1

[xdp]
enabled = true

[interfaces.primary]
device.route = "default"

[interfaces.primary.xdp]
zero_copy = false
workers.auto.count = 1

[tpu.xdp]
enabled = true
tx.queues = "all"

[turbine.xdp]
enabled = true
tx.queues = "all"

[repair.xdp]
enabled = true
tx.queues = "all"

[gossip.xdp]
enabled = true
tx.queues = "all"
