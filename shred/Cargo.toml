[package]
name = "agave-shred"
description = "Solana shred wire parser and serializer"
documentation = "https://docs.rs/agave-shred"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
publish = false

[features]
agave-unstable-api = [
    "agave-fec-set-recovery/agave-unstable-api",
    "agave-shred-verify/agave-unstable-api",
    "agave-shred-wire-format/agave-unstable-api",
    "agave-shredder/agave-unstable-api",
]
dev-context-only-utils = [
    "agave-fec-set-recovery/dev-context-only-utils",
    "agave-shred-verify/dev-context-only-utils",
    "agave-shred-wire-format/dev-context-only-utils",
    "agave-shredder/dev-context-only-utils",
]
frozen-abi = ["dep:solana-frozen-abi", "dep:solana-frozen-abi-macro"]

[dependencies]
agave-fec-set-recovery = { workspace = true }
agave-shred-verify = { workspace = true }
agave-shred-wire-format = { workspace = true }
agave-shredder = { workspace = true }
bytes = { workspace = true }
solana-clock = { workspace = true }
solana-frozen-abi = {
    workspace = true,
    optional = true,
    features = [
        "frozen-abi",
    ]
}
solana-frozen-abi-macro = {
    workspace = true,
    optional = true,
    features = [
        "frozen-abi",
    ]
}
solana-hash = { workspace = true, features = ["copy", "decode", "wincode"] }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true, features = ["verify", "wincode"] }
solana-signer = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
agave-shred = { path = ".", features = ["agave-unstable-api", "dev-context-only-utils"] }
assert_matches = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
solana-ledger = { workspace = true }
test-case = { workspace = true }
wincode = { workspace = true }

[[bench]]
name = "view"
harness = false

[[bench]]
name = "shredder"
harness = false

[lints]
workspace = true
