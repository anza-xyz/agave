[package]
name = "solana-shred"
description = "Solana shred wire parser and serializer"
documentation = "https://docs.rs/solana-shred"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
publish = false

[features]
dev-context-only-utils = []

[dependencies]
bytes = { workspace = true }
reed-solomon-erasure = { workspace = true, features = ["simd-accel"] }
solana-clock = { workspace = true }
solana-hash = { workspace = true, features = ["copy", "decode", "wincode"] }
solana-keypair = { workspace = true }
solana-packet = { workspace = true }
solana-pubkey = { workspace = true }
solana-sha256-hasher = { workspace = true, features = ["sha2"] }
solana-signature = { workspace = true, features = ["verify", "wincode"] }
solana-signer = { workspace = true }
static_assertions = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
solana-ledger = { workspace = true }
solana-shred = { path = ".", features = ["dev-context-only-utils"] }
test-case = { workspace = true }

[[bench]]
name = "view"
harness = false

[[bench]]
name = "build"
harness = false

[lints]
workspace = true
