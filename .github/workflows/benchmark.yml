name: Benchmark
on:
  push:
    branches:
      - master

jobs:
  benchmark:
    if: github.repository == 'anza-xyz/agave'
    name: benchmark
    runs-on: benchmark
    strategy:
      fail-fast: false
      matrix:
        # before adding your benchmark. please check these steps:
        # 1. generate a file that includes your benchmark result. it should looks like
        #
        #     ```
        #     test bench_accounts_delta_hash                         ... bench:  48,035,858 ns/iter (+/- 2,118,806)
        #     ```
        #
        # 2. run `DRY_RUN=1 ./ci/upload-benchmark.sh <YOUR_BENCHMARK_RESULT_FILE_PATH>` to ensure the datapoints are correct
        #    it should looks similar to this:
        #
        #    ```
        #    datapoint: ,commit=xxxx,test_suite=xxxx,name=bench_accounts_delta_hash median=48035858,deviation=2118806i
        #    ```
        #
        #    you only need to check `name`, `median` and `deviation`
        #
        test:
          - {
              name: "solana-runtime",
              commands: ["cargo +$rust_nightly bench -p solana-runtime"],
            }
          - {
              name: "solana-gossip",
              commands: ["cargo bench -p solana-gossip -- --output-format bencher --noplot"],
            }
          # split because transaction_recorder is a criterion bench, while poh and
          # poh_verify use the bencher harness, which would treat `--output-format`
          # as a benchmark name filter and run nothing
          - {
              name: "solana-poh",
              commands:
                [
                  "cargo bench -p solana-poh --bench poh",
                  "cargo bench -p solana-poh --bench poh_verify",
                  "cargo bench -p solana-poh --bench transaction_recorder -- --output-format bencher --noplot",
                ],
            }
          # split because consensus is a criterion bench, while shredder and
          # sigverify_stage use the bencher harness, which would treat
          # `--output-format` as a benchmark name filter and run nothing
          - {
              name: "solana-core",
              commands:
                [
                  "cargo bench -p solana-core --bench consensus -- --output-format bencher --noplot",
                  "cargo bench -p solana-core --bench shredder",
                  "cargo bench -p solana-core --bench sigverify_stage",
                ],
            }
          - {
              name: "solana-accounts-db",
              commands:
                [
                  "cargo bench -p solana-accounts-db -- --output-format bencher --noplot",
                ],
            }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Before Command
        if: ${{ matrix.test.before_command != '' }}
        run: |
          ${{ matrix.test.before_command }}

      - name: Command
        run: |
          # pipefail: without it the pipeline's status is tee's, so a bench
          # command that fails to even resolve a target passes silently
          set -o pipefail
          source ci/rust-version.sh nightly
          echo '${{ toJson(matrix.test.commands) }}' | jq -r '.[]' | while read command; do
            eval $command | tee -a benchmark
          done

      - name: Upload Result
        run: |
          TEST_SUITE="${{ matrix.test.name }}" \
          COMMIT_HASH="$(git rev-parse HEAD)" \
          INFLUX_HOST="${{ secrets.BENCHMARK_INFLUX_HOST }}" \
          INFLUX_DB="${{ secrets.BENCHMARK_INFLUX_DB }}" \
          INFLUX_USER="${{ secrets.BENCHMARK_INFLUX_USER }}" \
          INFLUX_PASSWORD="${{ secrets.BENCHMARK_INFLUX_PASSWORD }}" \
          INFLUX_MEASUREMENT="${{ secrets.BENCHMARK_INFLUX_MEASUREMENT }}" \
          ./ci/upload-benchmark.sh benchmark
