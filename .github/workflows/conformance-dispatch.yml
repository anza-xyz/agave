name: Conformance Dispatch

on:
  pull_request:
    branches:
      - master
      - v[0-9]+.[0-9]+
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/conformance-dispatch.yml"
      - "ci/test-conformance.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect affected fixture sets
    if: github.repository_owner == 'anza-xyz'
    runs-on: ubuntu-24.04
    outputs:
      entries: ${{ steps.table.outputs.entries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Rust
        shell: bash
        run: |
          source ci/rust-version.sh stable
          rustup default "$rust_stable"

      - id: table
        name: Build conformance table
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          entries=$(cargo run --quiet --manifest-path ci/xtask/Cargo.toml -- \
            conformance-table --pr-number "$PR_NUMBER")
          echo "entries=$entries" >> "$GITHUB_OUTPUT"

  fetch-vectors:
    name: fetch test-vectors
    needs: detect
    if: needs.detect.outputs.entries != '[]'
    runs-on: ubuntu-24.04
    steps:
      # TODO: use release tarballs once test-vectors publishes them.
      - name: Clone test-vectors
        shell: bash
        env:
          ENTRIES: ${{ needs.detect.outputs.entries }}
        run: |
          mapfile -t dirs < <(jq -r '.[].fixtures_dir' <<<"$ENTRIES" | sort -u)
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/firedancer-io/test-vectors.git test-vectors
          git -C test-vectors sparse-checkout set "${dirs[@]}"
          echo "test-vectors revision: $(git -C test-vectors rev-parse HEAD)"
          mkdir fd-vectors
          for dir in "${dirs[@]}"; do
            tar --zstd -C test-vectors -cf "fd-vectors/$dir.tar.zst" "$dir"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fd-test-vectors
          path: fd-vectors/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  run:
    name: "conformance: ${{ matrix.entry.fixtures_dir }}"
    needs: [detect, fetch-vectors]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.detect.outputs.entries) }}
    env:
      FIXTURES_DIR: ${{ matrix.entry.fixtures_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: fd-test-vectors
          path: fd-vectors

      - name: Extract fixtures
        shell: bash
        run: |
          tar --zstd -C fd-vectors -xf "fd-vectors/$FIXTURES_DIR.tar.zst"
          rm fd-vectors/*.tar.zst

      - name: Install dependencies
        shell: bash
        run: source .github/scripts/install-all-deps.sh ${{ runner.os }}

      - name: Run ${{ matrix.entry.bin }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.entry.package }}
          BIN: ${{ matrix.entry.bin }}
        run: ci/test-conformance.sh "$PACKAGE" "$BIN" "fd-vectors/$FIXTURES_DIR"
