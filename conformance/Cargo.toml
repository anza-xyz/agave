[package]
name = "agave-conformance"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
description = "Cross-domain conformance harnesses for Agave"
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
workspace = "../dev-bins"
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
bench = false
crate-type = ["cdylib", "lib"]

[dependencies]
bv = { workspace = true, features = ["serde"] }
prost = { workspace = true, optional = true }
protosol = { workspace = true, optional = true }
solana-bloom = { workspace = true }
solana-gossip = { workspace = true, features = ["dev-context-only-utils"] }
solana-hash = { workspace = true }
solana-keypair = { workspace = true }
solana-packet = { workspace = true }
solana-sanitize = { workspace = true }
wincode = { workspace = true }

[dev-dependencies]
bincode = { workspace = true }
solana-pubkey = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
solana-vote-program = { workspace = true }

[features]
agave-unstable-api = []
dev-context-only-utils = []
dummy-for-ci-check = ["ffi"]
ffi = ["agave-unstable-api", "dep:prost", "dep:protosol"]

[lints]
workspace = true
