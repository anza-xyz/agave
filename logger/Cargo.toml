[package]
name = "agave-logger"
description = "Agave Logger"
documentation = "https://docs.rs/agave-logger"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[lib]
name = "agave_logger"

[features]
agave-unstable-api = []
# Prototype: replace the env_logger backend with ftlog, which formats and writes
# log messages on a dedicated thread instead of the calling thread.
ftlog = ["dep:env_filter", "dep:ftlog", "dep:time"]

[dependencies]
env_filter = { workspace = true, optional = true }
env_logger = { workspace = true }
ftlog = { workspace = true, optional = true }
log = { workspace = true }
time = { workspace = true, optional = true }

[target."cfg(unix)".dependencies]
libc = { workspace = true }
signal-hook = { workspace = true }

[lints]
workspace = true
