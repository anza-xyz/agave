[package]
name = "solana-svm-conformance"
description = "Conformance harnesses for the Solana SVM"
publish = false
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
workspace = "../dev-bins"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "test_exec_elf_loader"
path = "src/bin/test_exec_elf_loader.rs"
required-features = ["cli", "ffi"]

[[bin]]
name = "test_exec_instr"
path = "src/bin/test_exec_instr.rs"
required-features = ["cli", "ffi"]

[[bin]]
name = "test_exec_txn"
path = "src/bin/test_exec_txn.rs"
required-features = ["cli", "ffi"]

[[bin]]
name = "test_exec_vm_serialization"
path = "src/bin/test_exec_vm_serialization.rs"
required-features = ["cli", "ffi"]

[[bin]]
name = "test_exec_vm_syscall"
path = "src/bin/test_exec_vm_syscall.rs"
required-features = ["cli", "ffi"]

[features]
default = ["cli", "ffi"]
agave-unstable-api = []
cli = ["dep:clap"]
dev-context-only-utils = []
dummy-for-ci-check = []
ffi = [
    "dep:agave-feature-set",
    "dep:agave-precompiles",
    "dep:prost",
    "dep:protosol",
    "dep:solana-compute-budget",
    "dep:solana-instruction",
    "dep:solana-program-runtime",
    "dep:solana-pubkey",
    "dep:solana-svm",
    "dep:solana-syscalls",
    "dep:solana-transaction-error",
    "solana-svm/conformance",
]
frozen-abi = []

[dependencies]
agave-feature-set = { workspace = true, optional = true }
agave-precompiles = { workspace = true, optional = true }
clap = { version = "4.5.59", features = ["derive"], optional = true }
prost = { workspace = true, optional = true }
protosol = { workspace = true, optional = true }
solana-compute-budget = { workspace = true, optional = true }
solana-instruction = { workspace = true, optional = true }
solana-program-runtime = { workspace = true, optional = true }
solana-pubkey = { workspace = true, optional = true }
solana-svm = { workspace = true, optional = true }
solana-syscalls = { workspace = true, optional = true }
solana-transaction-error = { workspace = true, optional = true }

[dev-dependencies]
solana-account = { workspace = true }
solana-clock = { workspace = true }
solana-rent = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-system-interface = { workspace = true }
solana-system-program = { workspace = true }
solana-sysvar-account = { workspace = true, features = ["dev-context-only-utils"] }
solana-sysvar-id = { workspace = true }
wincode = { workspace = true }

[lints]
workspace = true
