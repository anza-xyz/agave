[package]
name = "solana-vote"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Solana vote"
documentation = "https://docs.rs/solana-vote"
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[lib]
crate-type = ["lib"]
name = "solana_vote"

[[bench]]
harness = false
name = "vote_account"

[dependencies]
bincode = { workspace = true, optional = true }
log = { workspace = true }
qualifier_attr = { workspace = true, optional = true }
rand = { version = "0.9.4", optional = true }
serde = { workspace = true, features = ["rc"] }
solana-account = { workspace = true, features = ["serde", "wincode"] }
solana-bincode = { workspace = true }
solana-bls-signatures = { workspace = true, optional = true }
solana-clock = { workspace = true }
solana-frozen-abi = {
  workspace = true,
  features = [
    "frozen-abi",
  ],
  optional = true
}
solana-frozen-abi-macro = {
  workspace = true,
  features = [
    "frozen-abi",
  ],
  optional = true
}
solana-hash = { workspace = true, features = ["copy"] }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-packet = { workspace = true }
solana-pubkey = { workspace = true, features = ["wincode"] }
solana-sdk-ids = { workspace = true }
solana-serialize-utils = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-svm-transaction = { workspace = true }
solana-transaction = { workspace = true, features = ["wincode"] }
solana-vote-interface = { workspace = true, features = ["bincode", "wincode"] }
thiserror = { workspace = true }
wincode = { workspace = true }

[dev-dependencies]
arbitrary = { workspace = true }
bencher = { workspace = true }
bincode = { workspace = true }
rand = { workspace = true }
solana-keypair = { workspace = true }
solana-sha256-hasher = { workspace = true, features = ["sha2"] }
solana-signer = { workspace = true }
solana-system-transaction = { workspace = true }
solana-transaction = { workspace = true, features = ["dev-context-only-utils", "wincode"] }
solana-vote = { path = ".", features = ["agave-unstable-api"] }
solana-vote-interface = { workspace = true, features = ["bincode", "dev-context-only-utils"] }

[features]
agave-unstable-api = []
dev-context-only-utils = [
  "dep:bincode",
  "dep:qualifier_attr",
  "dep:rand",
  "dep:solana-bls-signatures",
  "solana-bls-signatures/solana-signer-derive",
]
frozen-abi = [
  "dep:solana-bls-signatures",
  "dep:solana-frozen-abi",
  "dep:solana-frozen-abi-macro",
  "solana-account/frozen-abi",
  "solana-bls-signatures/solana-signer-derive",
  "solana-pubkey/frozen-abi",
  "solana-vote-interface/frozen-abi",
]

[lints]
workspace = true
