# Built-in validator policy and reference for the config file format.
# Print this default config with `agave-validator --print-default-config`.
#
# Precedence: CLI flags override the user config file, which overrides these
# built-in defaults. Unknown fields are errors.
#
# User config inherits fields it does not specify. Exceptions:
# - `device` and `workers` are replaced as complete units.
# - Defining `interfaces` replaces the built-in interface labels. Matching labels
#   may inherit fields; new labels must fully define `device`, `xdp.zero_copy`,
#   and `xdp.workers`.
# XDP transmit is Linux-only. Other platforms validate this policy, then report
# it as inactive.

# Required in user config files; must be 1.
schema_version = 1

[xdp]
# Enable XDP for every component. False uses OS sockets. `--no-xdp` forces it false
# and nothing re-enables it.
enabled = true

# `primary` is a logical name referenced by each component's tx.interface.
# Version 1 supports one interface when XDP is enabled. Every component must name
# that declared label.
[interfaces.primary]
# Specify exactly one device selector. Bind the NIC carrying the default route:
device.route = "default"
# To bind a device by name, replace device.route with:
# device.name = "ens1f0"

[interfaces.primary.xdp]
# Strictly request AF_XDP zero-copy; startup fails when the device cannot
# provide it. `--xdp-zero-copy` and `--no-xdp-zero-copy` override it.
zero_copy = false

# Each worker owns one hardware queue and runs on one CPU. Worker CPUs must be
# in the process CPU affinity, cannot be the PoH core, and must leave at least
# one CPU for non-XDP work. Define the pool with exactly one mode, 1 to 4096
# workers; `--xdp-cpu-cores` replaces it with the workers.cpus form.
# Select the N highest eligible CPUs, excluding PoH; assign queues 0..N-1.
workers.auto.count = 1
# Alternative modes replace workers.auto.count:
# Queue 0 uses CPU 8; queue 1 uses CPU 9.
# workers.cpus = [8, 9]
# Map queues to CPUs explicitly, for a NIC whose queue ids are not 0..n-1.
# List order is sender order. Requires device.name.
# workers.bindings = [
#   { queue = 0, cpu = 8 },
#   { queue = 3, cpu = 9 },
# ]

# These settings apply to each component below.
# tx.interface names a declared interface.
# tx.queues is "all", or hardware queue ids in sender order, e.g. [0, 3].
# Ids must exist in that interface's worker pool. Components may share a queue.
[tpu.xdp]
tx.interface = "primary"
tx.queues = "all"

[turbine.xdp]
tx.interface = "primary"
tx.queues = "all"

[repair.xdp]
tx.interface = "primary"
tx.queues = "all"

[gossip.xdp]
tx.interface = "primary"
tx.queues = "all"

[votor.xdp]
tx.interface = "primary"
tx.queues = "all"
