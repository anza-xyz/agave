[package]
name = "solana-rayon-threadlimit"
description = "solana-rayon-threadlimit"
documentation = "https://docs.rs/solana-rayon-threadlimit"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[package.metadata.cargo-shear]
# self dev-dependency enables agave-unstable-api / dev-context-only-utils for the
# crate's own test targets; cargo-shear flags it as unused (false positive).
ignored = ["solana-rayon-threadlimit"]

[features]
agave-unstable-api = []

[dependencies]
log = { workspace = true }
num_cpus = { workspace = true }

[dev-dependencies]
solana-rayon-threadlimit = { path = ".", features = ["agave-unstable-api"] }

[lints]
workspace = true
