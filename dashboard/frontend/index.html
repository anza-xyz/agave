    <meta charset="utf-8" />

    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Agave Dashboard</title>
    <!--
      Stamped before anything renders. Left to the bundle, a dashboard set to
      light would paint dark for as long as the JavaScript took to arrive, and
      flash on every reload. Kept in step with src/theme.ts.
    -->
    <script>
      try {
        if (localStorage.getItem("agave-dashboard-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch (e) {
        /* storage unavailable; dark is the default anyway */
      }
    </script>
    <!--
      The splash lives here rather than in the React tree so that it paints on
      the first frame, before the bundle has been parsed. src/splash.ts removes
      it once the first snapshot has arrived. The wordmark is inlined as a data
      URI for the same reason: a second request would leave the panel bare for
      as long as it took to answer.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #dce2cf;
        opacity: 1;
        transition: opacity 450ms ease;
      }

      #splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      #splash > img {
        width: clamp(180px, 34vw, 380px);
        height: auto;
      }

      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition-duration: 1ms;
        }
      }
    </style>
  </head>
