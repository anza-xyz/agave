# This package only exists to avoid circular dependencies during cargo publish:
# solana-bpf-loader-program -> solana-program-test -> solana-bpf-loader-program

[package]
name = "solana-bpf-loader-program-tests"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dev-dependencies]
agave-feature-set = { workspace = true }
assert_matches = { workspace = true }
bincode = { workspace = true }
solana-account = { workspace = true }
solana-bpf-loader-program = {
  path = "../bpf_loader",
  default-features = false,
  features = ["agave-unstable-api"]
}
solana-clock = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-loader-v3-interface = { workspace = true }
solana-program-test = { path = "../../program-test", features = ["agave-unstable-api"] }
solana-pubkey = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true }
solana-transaction = { workspace = true }
solana-transaction-error = { workspace = true }
test-case = { workspace = true }

[features]
agave-unstable-api = []

[lints]
workspace = true
