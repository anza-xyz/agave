[package]
name = "agave-block-production-scheduler"
description = "Agave block production scheduler"
documentation = "https://docs.rs/agave-block-production-scheduler"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
agave-unstable-api = []

[[bin]]
name = "agave-block-production-scheduler"
path = "src/main.rs"
required-features = ["agave-unstable-api"]

[dependencies]
agave-logger = { workspace = true }
agave-reserved-account-keys = { workspace = true }
agave-scheduler-bindings = { workspace = true }
agave-scheduler-handshake = { workspace = true }
agave-scheduling-utils = { workspace = true }
agave-transaction-view = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
rts-alloc = { workspace = true }
serde = { workspace = true }
shaq = { workspace = true }
signal-hook = { workspace = true }
slab = { workspace = true }
solana-clock = { workspace = true }
solana-message = { workspace = true }
solana-metrics = { workspace = true }
solana-pubkey = { workspace = true, features = ["rand"] }
solana-svm-transaction = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
solana-hash = { workspace = true }
solana-signature = { workspace = true }
solana-transaction = { workspace = true, features = ["wincode"] }
tempfile = { workspace = true }
wincode = { workspace = true }

[lints]
workspace = true
